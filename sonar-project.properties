# SonarQube Cloud analysis of the CareBridge front-end (run by the pipeline after the tests).
sonar.organization=claudia29a
sonar.projectKey=Claudia29a_GP-platform-front-end
sonar.projectName=CareBridge front-end

# Application code, plus the pipeline, Dockerfile and nginx config, which Sonar also checks.
sonar.sources=.
sonar.exclusions=node_modules/**,dist/**,coverage/**,.angular/**,**/*.spec.ts,src/testing/**
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,src/testing/**

# Coverage report written by "npm run test:coverage".
sonar.javascript.lcov.reportPaths=coverage/carebridge-front-end/lcov.info
# Bootstrap and environment files contain no logic to test.
sonar.coverage.exclusions=src/main.ts,src/environments/**,src/app/app.config.ts,src/app/app.routes.ts

# Fail the pipeline when the quality gate fails, so a failing change is never deployed.
sonar.qualitygate.wait=true
