<header class="topbar">
  <div class="topbar-inner">
    <a routerLink="/" class="brand">CareBridge</a>

    @if (auth.user(); as user) {
      <nav aria-label="Main">
        @if (auth.isStaff()) {
          <a routerLink="/queue" routerLinkActive="active">Queue</a>
          <a routerLink="/questions" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">All questions</a>
        } @else {
          <a routerLink="/ask" routerLinkActive="active">Ask a question</a>
          <a routerLink="/questions" routerLinkActive="active">My questions</a>
          <a routerLink="/my-data" routerLinkActive="active">My data</a>
        }
      </nav>

      <div class="account">
        <span class="who">
          <span class="name">{{ user.name }}</span>
          <span class="role">{{ roleLabel() }}</span>
        </span>
        <button type="button" class="sign-out" (click)="signOut()">Sign out</button>
      </div>
    }
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <a routerLink="/privacy">Privacy</a>
</footer>

@if (auth.user()?.emailVerified && auth.user()?.privacyConsentNeeded) {
  <app-privacy-consent />
}
